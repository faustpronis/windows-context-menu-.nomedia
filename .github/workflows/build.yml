name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          # A tag build carries its own version; a branch build falls back to the
          # version in Directory.Build.props so artifacts stay identifiable.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            [xml]$props = Get-Content Directory.Build.props
            $version = "$($props.Project.PropertyGroup.Version | Select-Object -First 1)"
          }
          if (-not $version) { $version = '0.0.0' }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "version = $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FolderTools.sln

      - name: Build (Release)
        run: dotnet build FolderTools.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test src/FolderTools.Tests/FolderTools.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      - name: Stage release files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $stage = "staging/FolderTools"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $bin = "src/FolderTools.App/bin/Release/net48"
          Copy-Item "$bin/FolderTools.exe"        $stage
          # Keep runtime dependencies out of the program folder; app.config enables
          # CLR probing in this private subdirectory.
          $dllStage = Join-Path $stage "FolderTools_dlls"
          New-Item -ItemType Directory -Force -Path $dllStage | Out-Null
          Copy-Item "$bin/*.dll"                  $dllStage
          Copy-Item "$bin/FolderTools.exe.config" $stage
          Copy-Item "installer/install.bat"       $stage
          Copy-Item "installer/uninstall.bat"     $stage
          Copy-Item "README.md"                   $stage
          [xml]$appConfig = Get-Content (Join-Path $stage "FolderTools.exe.config")
          $probing = $appConfig.SelectSingleNode("/configuration/runtime/probing")
          if (-not $probing -or $probing.GetAttribute("privatePath") -notmatch '(^|;)FolderTools_dlls($|;)') {
            throw "FolderTools.exe.config must probe FolderTools_dlls"
          }
          foreach ($requiredDll in @("FolderTools.Core.dll", "Renci.SshNet.dll", "System.Security.Cryptography.ProtectedData.dll")) {
            if (-not (Test-Path (Join-Path $dllStage $requiredDll))) {
              throw "Required runtime dependency missing from FolderTools_dlls: $requiredDll"
            }
          }
          if (Get-ChildItem $stage -Filter "*.dll") {
            throw "DLL files must not be placed beside FolderTools.exe"
          }
          $zip = "FolderTools-$version.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          Get-ChildItem $stage | Select-Object Name, Length
          Get-ChildItem $dllStage | Select-Object Name, Length
          "ZIP=$zip" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Verify version stamp
        shell: pwsh
        run: |
          # Guards against a tag that never reaches the executable, which would
          # make the download silently claim the wrong version.
          $info = (Get-Item "staging/FolderTools/FolderTools.exe").VersionInfo
          Write-Host "FileVersion    : $($info.FileVersion)"
          Write-Host "ProductVersion : $($info.ProductVersion)"
          if ($info.ProductVersion -notlike "$env:VERSION*") {
            throw "Expected version $env:VERSION in the executable, got $($info.ProductVersion)"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderTools-${{ steps.version.outputs.value }}
          path: ${{ env.ZIP }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "$env:ZIP" `
            --title "FolderTools $env:VERSION" `
            --generate-notes
